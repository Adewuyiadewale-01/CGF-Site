<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nanomantic — render</title>
<!-- Renders one asset on a transparent canvas for Figma and for the site's stills.
     ?asset=street&phase=0.6 | house | strata | shop | panel&t=1 | battery&t=1   (&w=&h=) -->
<style>html, body { margin: 0; background: transparent; } canvas { display: block; width: 100vw; height: 100vh; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { V, makeStage } from './kit.js';
  import { street, building, exploded } from './scenes.js';
  const q = new URLSearchParams(location.search), asset = q.get('asset') || 'street';
  const frames = {
    street:  { viewH: 36, look: V(2.5, 3, 0), az: 0.5, el: 0.5 },
    house:   { viewH: 17, look: V(0.5, 1.6, 0) },
    strata:  { viewH: 22, look: V(0, 6, 0) },
    shop:    { viewH: 15, look: V(0, 0.8, 0) },
    panel:   { viewH: 16, look: V(0, 4.2, 0) },
    battery: { viewH: 17, look: V(-0.8, 6.4, -0.4) },
  };
  const stage = makeStage(document.getElementById('c'), { ...frames[asset], preserve: true });
  let s;
  if (asset === 'street') s = street(stage);
  else if (asset === 'panel' || asset === 'battery') s = exploded(stage, asset);
  else building(stage, asset);
  const t = +(q.get('t') ?? 1), phase = +(q.get('phase') ?? 0.6);
  if (asset === 'street') for (let i = 0; i < 120; i++) s.set(phase, 1.3 + i * 0.016);
  if (s?.set && asset !== 'street') s.set(t);
  stage.render();
  window.__ready = true;
</script>
</body>
</html>
