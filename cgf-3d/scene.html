<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CGF 3D Scenes</title>
<style>
  html,body{margin:0;height:100%;background:#0A0B0D;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import { mountScene } from './scenes.js';
const q = new URLSearchParams(location.search);
const api = mountScene(document.body, {
  scene: q.get('scene') || 'hero',
  still: q.has('still'),
  armed: parseFloat(q.get('armed') ?? '1'),
  t: parseFloat(q.get('t') ?? '2.0'),
  transparent: q.has('alpha'),
});
window.__api = api;
</script>
</body>
</html>
